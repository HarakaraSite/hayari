<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayari</title>
  <link rel="icon" href="/hayari-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/stylesheets/pico.min.css" />
  <link rel="stylesheet" href="/stylesheets/app.css" />
</head>
<body>
  <div id="app">

    <!-- ── Left: Sidebar ────────────────────────────────────── -->
    <nav id="sidebar">
      <div id="sidebar-header">
        <div class="app-brand">
          <img class="app-brand-mark" src="/hayari-mark.svg" width="28" height="28" alt="" />
          <strong>Hayari</strong>
        </div>
        <button id="btn-refresh" class="icon-btn" title="Refresh all">&#x21bb;</button>
      </div>

      <div id="status-tabs">
        <button data-filter="unread" class="active">Unread</button>
        <button data-filter="starred">Starred</button>
        <button data-filter="all">All</button>
      </div>

      <ul id="feed-list"></ul>

      <div id="sidebar-footer">
        <button id="btn-add-feed">+ Feed</button>
        <button id="btn-add-folder" class="secondary">+ Folder</button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" fill-rule="evenodd" d="M14.208 4.83q.68.21 1.3.54l1.833-1.1a1 1 0 0 1 1.221.15l1.018 1.018a1 1 0 0 1 .15 1.221l-1.1 1.833q.33.62.54 1.3l2.073.519a1 1 0 0 1 .757.97v1.438a1 1 0 0 1-.757.97l-2.073.519q-.21.68-.54 1.3l1.1 1.833a1 1 0 0 1-.15 1.221l-1.018 1.018a1 1 0 0 1-1.221.15l-1.833-1.1q-.62.33-1.3.54l-.519 2.073a1 1 0 0 1-.97.757h-1.438a1 1 0 0 1-.97-.757l-.519-2.073a7.5 7.5 0 0 1-1.3-.54l-1.833 1.1a1 1 0 0 1-1.221-.15L4.42 18.562a1 1 0 0 1-.15-1.221l1.1-1.833a7.5 7.5 0 0 1-.54-1.3l-2.073-.519A1 1 0 0 1 2 12.72v-1.438a1 1 0 0 1 .757-.97l2.073-.519q.21-.68.54-1.3L4.27 6.66a1 1 0 0 1 .15-1.221L5.438 4.42a1 1 0 0 1 1.221-.15l1.833 1.1q.62-.33 1.3-.54l.519-2.073A1 1 0 0 1 11.28 2h1.438a1 1 0 0 1 .97.757zM12 16a4 4 0 1 0 0-8a4 4 0 0 0 0 8" />
          </svg>
        </button>
        <a href="/logout" id="btn-logout" class="icon-btn" title="Sign out">&#x23FB;</a>
      </div>
    </nav>

    <div id="sidebar-resizer" class="column-resizer" aria-hidden="true"></div>

    <!-- ── Middle: Item list ─────────────────────────────────── -->
    <div id="item-list-pane">
      <div id="item-list-header">
        <button id="btn-show-sidebar" class="icon-btn" title="Feeds">&#x2630;</button>
        <span id="item-list-title">Unread</span>
        <button id="btn-manage-source" class="icon-btn" title="Manage selected feed or folder" hidden>&#x22ef;</button>
        <button id="btn-mark-all-read" class="outline small" title="Mark all read (Shift+R)">&#x2713; All</button>
      </div>
      <div id="search-bar">
        <input type="text" id="search-input" aria-label="Search" title="Search (/)" autocomplete="off" />
      </div>
      <ul id="item-list" role="listbox"></ul>
      <div id="load-more-sentinel"></div>
      <div id="item-list-empty" hidden>No items</div>
    </div>

    <div id="item-list-resizer" class="column-resizer" aria-hidden="true"></div>

    <!-- ── Right: Article detail ─────────────────────────────── -->
    <div id="item-detail">
      <div id="item-detail-empty">
        <span>Select an article</span>
        <span class="hint">j / k to navigate</span>
      </div>
      <div id="item-detail-content" hidden>
        <div id="detail-toolbar">
          <button id="btn-back-list"   class="icon-btn" title="Back to list (q)">&#x2190;</button>
          <button id="btn-star"        title="Star (s)">&#x2606;</button>
          <button id="btn-toggle-read" title="Toggle read (r)">&#x25cb;</button>
          <button id="btn-readability" title="Readability mode (i)">Aa</button>
          <a      id="btn-open"        target="_blank" rel="noopener noreferrer" title="Open in browser (o)">&#x2197;</a>
          <span   id="toolbar-spacer"></span>
          <button id="btn-prev-item"   title="Previous (k)">&#x2191;</button>
          <button id="btn-next-item"   title="Next (j)">&#x2193;</button>
        </div>
        <div id="detail-header">
          <h1 id="detail-title"></h1>
          <div id="detail-meta"></div>
        </div>
        <div id="detail-body"></div>
      </div>
    </div>

  </div><!-- #app -->

  <!-- ── Add-feed modal ───────────────────────────────────────── -->
  <dialog id="modal-add-feed">
    <article>
      <header>
        <button data-close-modal aria-label="Close">&times;</button>
        <h3>Add Feed</h3>
      </header>
      <form id="form-add-feed" autocomplete="off">
        <input type="text" id="input-feed-url" placeholder="Feed URL or site URL" required />
        <div id="feed-candidates" hidden></div>
        <div id="feed-add-footer">
          <button type="button" class="secondary" data-close-modal>Cancel</button>
          <button type="submit" id="btn-feed-submit">Find</button>
        </div>
      </form>
    </article>
  </dialog>

  <!-- ── Edit feed/folder modal ───────────────────────────────── -->
  <dialog id="modal-manage">
    <article>
      <header>
        <button data-close-modal aria-label="Close">&times;</button>
        <h3 id="modal-manage-title"></h3>
      </header>
      <div id="modal-manage-body"></div>
    </article>
  </dialog>

  <!-- ── Settings modal ───────────────────────────────────────── -->
  <dialog id="modal-settings">
    <article>
      <header>
        <button data-close-modal aria-label="Close">&times;</button>
        <h3>Settings</h3>
      </header>
      <form id="form-settings">
        <label>Theme
          <select name="theme">
            <option value="auto">Auto (system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>Font size
          <select name="font_size">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label>Auto-refresh interval (minutes, 0&nbsp;=&nbsp;off)
          <input type="number" name="refresh_rate" min="0" max="1440" placeholder="30" />
        </label>
        <button type="submit">Save</button>
      </form>
      <hr />
      <div id="opml-section">
        <strong>OPML</strong>
        <div id="opml-actions">
          <button id="btn-opml-import" class="outline">Import</button>
          <button id="btn-opml-export" class="outline">Export</button>
        </div>
        <input type="file" id="input-opml-file" accept=".opml,.xml" hidden />
      </div>
    </article>
  </dialog>

  <script src="/javascripts/api.js"></script>
  <script src="/javascripts/key.js"></script>
  <script src="/javascripts/app.js"></script>
</body>
</html>
