# Based on .forgejo/release-profile.yml.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          set -euo pipefail
          go test ./...

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # Use a fresh module cache for cross-compilation. This avoids a
          # runner-local extracted module cache from contaminating a target
          # platform build.
          export GOMODCACHE="$(mktemp -d)"
          LDFLAGS='-s -w -X main.Version=${{ forgejo.ref_name }}'
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-darwin-amd64 ./cmd/hayari
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-darwin-arm64 ./cmd/hayari
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-linux-amd64 ./cmd/hayari
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-linux-arm64 ./cmd/hayari
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-windows-amd64.exe ./cmd/hayari
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/hayari-windows-arm64.exe ./cmd/hayari
          (cd dist && sha256sum hayari-* > SHA256SUMS)

      - name: Upload release
        if: success()
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ forgejo.token }}
          tag: ${{ forgejo.ref_name }}
          release-dir: dist
          release-notes: ${{ format('Release {0}', forgejo.ref_name) }}
